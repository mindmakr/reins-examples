name: CI

# Runs once per change: on pull requests into main, not again on the push that merges them.
# Run `npm run build && npm test` locally before opening the pull request.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/screenshots/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build production bundle and verify zero reins code ships
        run: npm run build
      - name: Run tests
        run: npm test
